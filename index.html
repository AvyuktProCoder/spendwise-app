<!doctype html>
<html lang="en">
  <head>
    <meta name="theme-color" content="#080b11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sign in to SpendWise and learn what your money can really do."
    />
    <title>Sign in | SpendWise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-auth-mode="login">
    <main class="app-shell">
      <section class="auth-card" aria-labelledby="page-title">
        <header class="brand">
          <a class="brand__mark" href="index.html" aria-label="SpendWise home">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M11 12.5h17.5a8.5 8.5 0 0 1 0 17H19a5.5 5.5 0 0 0 0 11h18" />
              <path d="M24 7v34" />
            </svg>
          </a>
          <span>SpendWise</span>
        </header>

        <div class="hero-copy">
          <p class="eyebrow">WELCOME BACK</p>
          <h1 id="page-title">Make every choice count.</h1>
          <p>Sign in to explore what products really cost and find smarter alternatives.</p>
        </div>

        <form class="auth-form" action="profile-onboarding.html" method="get">
          <label for="email">Email or username</label>
          <input
            id="email"
            name="email"
            type="text"
            autocomplete="username"
            placeholder="you@example.com"
            required
          />

          <div class="label-row">
            <label for="password">Password</label>
            <a href="#">Forgot password?</a>
          </div>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          />

          <button class="button button--primary" type="submit">Sign in</button>
        </form>

        <div class="divider" role="separator"><span>or</span></div>

        <button class="button button--secondary" type="button" data-auth-entry>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.7h5.4a4.6 4.6 0 0 1-2 3v2.4h3.2c1.9-1.7 3-4.2 3-7.1Z" />
            <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.5A10 10 0 0 0 12 22Z" />
            <path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9l3.3-2.5Z" />
            <path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.8A9.7 9.7 0 0 0 3.1 7.5l3.3 2.6C7.2 7.7 9.4 6 12 6Z" />
          </svg>
          Continue with Google
        </button>

        <p class="switch-page">
          New to SpendWise?
          <a class="switch-page__cta" href="signup.html">Create an account <span aria-hidden="true">→</span></a>
        </p>
      </section>
    </main>
    <script src="auth.js"></script>
      <script src="pwa.js" defer></script>
  </body>
</html>
